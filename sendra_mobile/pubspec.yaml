name: walletium
description: A new Flutter project.

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.6.1
  http: ^1.0.0
  flutter_google_maps_webservices: ^1.1.1
  flutter_map: ^6.1.0
  latlong2:
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  location:
  fluttertoast: ^8.0.7
  firebase_auth: ^6.5.7
  shared_preferences: ^2.0.12
  cupertino_icons: ^1.0.5
  get: ^4.7.3
  flutter_screenutil: ^5.5.4
  google_fonts: ^8.2.1
  cached_network_image: ^3.1.0
  flutter_image_compress: ^2.2.0
  font_awesome_flutter: ^10.2.1
  country_code_picker: ^3.0.0
  country_currency_pickers: ^3.0.0
  currency_picker: ^2.0.12
  image_picker: ^1.2.3
  carousel_slider: ^4.1.1
  csc_picker: ^0.2.6
  pin_code_fields: ^8.0.1
  permission_handler: ^13.0.1
  firebase_core: ^4.13.0
  image: ^4.0.15
  path_provider: ^2.0.5

dependency_overrides:
  modal_bottom_sheet: ^3.0.0-pre
  # permission_handler_android 14.0.0 utilise une syntaxe Gradle Kotlin DSL
  # (kotlin { compilerOptions { ... } }) qui exige Kotlin 2.3.20 / AGP
  # 9.0.1 — bien plus récent que le reste de ce projet Flutter. On fixe
  # une version antérieure connue pour compiler avec la toolchain actuelle.
  permission_handler_android: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.1

flutter_icons:

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/splash/
    - assets/images/onboard/
    - assets/images/others/
    - assets/images/bg/
    - assets/images/people/
    - assets/images/country/
    

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
