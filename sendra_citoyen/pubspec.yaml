name: walletium
description: epaVie — application citoyenne SENDRA.

publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  google_maps_flutter: ^2.6.1
  http: ^1.0.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.0.12
  get: ^4.7.3
  cached_network_image: ^3.1.0
  flutter_image_compress: ^2.2.0
  image_picker: ^1.2.3
  pin_code_fields: ^8.0.1
  firebase_core: ^4.13.0
  path_provider: ^2.0.5
  # Mode hors ligne des signalements : détection du réseau + clé de
  # déduplication (uuid) réémise à chaque tentative de synchronisation.
  connectivity_plus: ^6.0.5
  uuid: ^4.4.0
  # Démo web uniquement (lib/demo) : remplacer GPS, géocodage et appareil photo.
  geolocator_platform_interface: any
  geocoding_platform_interface: any
  image_picker_platform_interface: any

dependency_overrides:
  modal_bottom_sheet: ^3.0.0-pre

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.1


flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/splash/
    - assets/images/others/

  # Police Inter embarquée (plus de téléchargement à l'exécution).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
